<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆星图</title>
<style>
  :root { --ink: #dfe7ff; --dim: #7d89a8; --line: rgba(120, 160, 255, 0.16); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #020308; color: var(--ink);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; position: fixed; inset: 0; }

  .hud { position: fixed; z-index: 5; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  #brand { top: 14px; left: 16px; width: 86px; height: 86px; pointer-events: none; }
  #brand .brand-img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    object-fit: cover; opacity: 0.95;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 76%);
    mask-image: radial-gradient(circle at 50% 50%, #000 58%, transparent 76%);
    filter: drop-shadow(0 0 18px rgba(255, 214, 140, 0.35));
  }

  #search { top: 20px; right: 26px; width: 300px; }
  #q {
    width: 100%; padding: 9px 12px; color: var(--ink);
    background: rgba(8, 14, 28, 0.66); border: 1px solid var(--line);
    border-radius: 9px; outline: none; font: inherit; backdrop-filter: blur(8px);
  }
  #q:focus { border-color: rgba(140, 175, 255, 0.45); box-shadow: 0 0 0 3px rgba(90, 130, 255, 0.08); }
  #hits { margin-top: 8px; max-height: 44vh; overflow: auto; }
  #hits .hit {
    padding: 7px 10px; margin-bottom: 5px; border-radius: 8px; cursor: pointer;
    background: rgba(10, 16, 32, 0.72); border: 1px solid transparent;
    border-left: 2px solid var(--c, #6cf); font-size: 12px; color: #c8d4f0;
  }
  #hits .hit:hover { border-color: rgba(140, 175, 255, 0.35); background: rgba(18, 28, 54, 0.85); }
  #hits .hit b { color: #fff; font-weight: 400; }
  #hits .hit span { color: var(--dim); font-size: 11px; }

  #legend { left: 24px; bottom: 22px; }
  #legend .row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 3px 0; color: #aab6d4; font-size: 12px; user-select: none;
  }
  #legend .row.off { opacity: 0.28; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 9px currentColor; background: currentColor; }
  #legend .n { color: #66718c; font-size: 11px; margin-left: auto; }

  #detail {
    position: fixed; z-index: 10; right: 0; top: 0; height: 100%; width: 380px; padding: 22px 24px 24px;
    background: linear-gradient(180deg, rgba(4, 7, 16, 0.95), rgba(3, 5, 12, 0.9));
    border-left: 1px solid rgba(120, 160, 255, 0.12); backdrop-filter: blur(14px);
    transform: translateX(100%); transition: transform 0.26s ease; overflow: auto;
  }
  #detail.on { transform: none; }
  #detail .badge {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px;
    border: 1px solid currentColor; margin-right: 6px;
  }
  #detail h2 { font-size: 14px; font-weight: 400; margin: 12px 0 2px; color: #e8eeff; }
  #detail .meta { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  #detail .body {
    white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.75;
    color: #c6d2ec; background: rgba(12, 20, 40, 0.6); border: 1px solid rgba(120, 160, 255, 0.08);
    border-radius: 10px; padding: 12px; max-height: 46vh; overflow: auto;
  }
  #detail .acts { display: flex; gap: 8px; margin: 14px 0 4px; }
  #detail .acts button {
    flex: 1; padding: 7px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px;
    color: #c6d2ec; background: rgba(20, 30, 58, 0.7); border: 1px solid rgba(120, 160, 255, 0.18);
  }
  #detail .acts button:hover { background: rgba(32, 46, 84, 0.9); border-color: rgba(140, 175, 255, 0.4); }
  #detail .acts button:disabled { opacity: 0.5; cursor: default; }
  #detail h3 { font-size: 12px; color: #66718c; font-weight: 400; margin: 18px 0 8px; letter-spacing: 1px; }
  #detail .rel {
    padding: 7px 9px; border-radius: 8px; background: rgba(14, 22, 44, 0.6);
    margin-bottom: 5px; font-size: 12px; color: #a9b7d6; cursor: pointer;
  }
  #detail .rel:hover { background: rgba(24, 36, 68, 0.85); }
  #close {
    position: absolute; top: 18px; right: 18px; width: 28px; height: 28px;
    border-radius: 8px; border: 1px solid var(--line); background: rgba(14, 22, 44, 0.7);
    color: #8d9cb8; cursor: pointer; font-size: 15px; line-height: 1;
  }
  #stats { right: 24px; bottom: 22px; color: #5d6884; font-size: 11px; text-align: right; letter-spacing: 1px; }
  #empty { position: fixed; inset: 0; display: none; place-items: center; color: var(--dim); font-size: 14px; }

/* ---------- 第三幕：规则区 ---------- */
#rules { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
  background:
    linear-gradient(180deg, rgba(90,150,255,0.10), transparent 38%),
    repeating-linear-gradient(0deg, rgba(120,180,255,0.045) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(120,180,255,0.045) 0 1px, transparent 1px 44px),
    radial-gradient(120% 85% at 50% 0%, #16306b 0%, #0c1c42 38%, #071026 72%, #050b1a 100%);
  padding: 16px 22px 20px; gap: 10px; }
#rules.hidden { display: none; }

.r-head { display: flex; align-items: center; gap: 18px; }
.r-back { flex: 0 0 auto; width: 28px; height: 28px; cursor: pointer; font-size: 18px; line-height: 1;
  color: #9fb6dd; background: rgba(18,28,52,0.7); border: 1px solid rgba(120,150,220,0.28);
  border-radius: 2px; padding-bottom: 2px; }
.r-back:hover { color: #eaf4ff; border-color: rgba(130,200,255,0.6); box-shadow: 0 0 12px rgba(90,180,255,0.3); }
.r-brand { display: flex; align-items: center; flex: 0 0 auto; }
.r-brand b { font-size: 17px; letter-spacing: 5px; color: #e6eeff; text-indent: 5px;
  text-shadow: 0 0 16px rgba(120,180,255,0.4); }

.r-tabs { display: flex; align-items: center; gap: 4px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
.r-tabs::-webkit-scrollbar { height: 3px; }
.r-tabs::-webkit-scrollbar-thumb { background: rgba(120,160,230,0.35); }
.tab { position: relative; white-space: nowrap; font-size: 12px; padding: 7px 16px; cursor: pointer;
  color: #8fa3cc; background: linear-gradient(180deg, rgba(28,42,80,0.55), rgba(12,20,42,0.5));
  border: 1px solid rgba(110,150,220,0.2); border-radius: 2px; }
.tab > span { display: inline-block; }
.tab:hover { color: #cfe0ff; border-color: rgba(130,190,255,0.45); }
.tab.on { color: #eaf4ff; border-color: rgba(120,200,255,0.8);
  background: linear-gradient(180deg, rgba(52,110,200,0.75), rgba(20,50,110,0.6));
  box-shadow: 0 0 16px rgba(80,170,255,0.35), inset 0 0 12px rgba(120,200,255,0.18); }
.tab.missing { opacity: 0.5; border-style: dashed; }
.tab.pinned { position: sticky; left: 0; z-index: 3; color: #efdfae; border-color: rgba(226,200,140,0.5);
  background: linear-gradient(180deg, rgba(70,58,28,0.7), rgba(24,20,10,0.7)); }
.tab.pinned.on { color: #fff5d8; border-color: rgba(240,215,150,0.9);
  box-shadow: 0 0 16px rgba(226,200,140,0.35); }

.r-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.r-actions button { font-size: 12px; padding: 6px 14px; cursor: pointer; border-radius: 2px;
  color: #a9bde0; background: rgba(18,28,52,0.7); border: 1px solid rgba(120,150,220,0.28); }
.r-actions button:hover:not(:disabled) { color: #eaf3ff; border-color: rgba(130,200,255,0.6); }
.r-actions button:disabled { opacity: 0.3; cursor: default; }
.r-actions button.on { color: #bdf5dd; border-color: rgba(120,220,180,0.6); }

.r-bar { position: relative; height: 26px; background: rgba(16,32,64,0.9);
  border: 1px solid rgba(90,120,190,0.22); overflow: hidden; }
.r-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(90deg, rgba(70,170,255,0.35), rgba(70,170,255,0.08)); transition: width .4s; }
.r-bar::after { content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 39px, rgba(120,160,230,0.14) 39px 40px); }
.r-bar span { position: absolute; left: 10px; top: 4px; font-size: 11px; color: #cfe0ff; z-index: 2;
  text-shadow: 0 0 8px rgba(90,150,255,0.6); }
.r-bar span.pct { position: absolute; left: auto; right: 10px; top: 4px; font-size: 12px; font-weight: 600;
  color: #e9f2ff; z-index: 2; }

.r-cabinet { position: relative; display: flex; align-items: flex-end; gap: 8px; overflow-x: auto;
  padding: 46px 2px 14px; min-height: 330px; }
.fab-label { position: absolute; top: 2px; transform: translateX(-50%); text-align: center;
  font-size: 12px; letter-spacing: 1px; color: #dce9ff; white-space: nowrap; pointer-events: none; }
.fab-label::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 22px;
  background: linear-gradient(180deg, rgba(150,200,255,0.75), rgba(150,200,255,0.1)); }
.fab-label i { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent;
  border-right: 4px solid transparent; border-top: 6px solid rgba(150,200,255,0.85);
  position: absolute; left: 50%; top: calc(100% + 22px); margin-left: -4px; }
.fab-label em { font-style: normal; margin-left: 5px; font-size: 9px; padding: 0 4px; border-radius: 2px;
  color: #1a1206; background: #e8b64c; vertical-align: 2px; }
.file-card { flex: 0 0 108px; height: 262px; cursor: pointer; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: stretch; border-radius: 2px;
  border: 1px solid rgba(110,150,220,0.22);
  background:
    repeating-linear-gradient(90deg, rgba(120,180,255,0.05) 0 1px, transparent 1px 8px),
    linear-gradient(180deg, rgba(28,48,94,0.5), rgba(8,14,30,0.66));
  transition: transform .2s, box-shadow .2s, border-color .2s; }
.file-card::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(140,200,255,0.55), transparent); opacity: 0.45; }
.file-card .f-icon { position: relative; width: 36px; height: 30px; margin: 34px auto 0; opacity: 0.7; }
.file-card .f-icon::before { content: ''; position: absolute; left: 0; top: 7px; width: 36px; height: 22px;
  border-radius: 2px; border: 1.5px solid rgba(150,200,255,0.85); }
.file-card .f-icon::after { content: ''; position: absolute; left: 1px; top: 0; width: 15px; height: 7px;
  border: 1.5px solid rgba(150,200,255,0.85); border-bottom: none; border-radius: 2px 2px 0 0; }
.file-card .f-body { flex: 1; margin: 12px 8px; border-radius: 2px;
  background: linear-gradient(180deg, rgba(120,180,255,0.1), rgba(120,180,255,0.02) 55%, rgba(120,180,255,0.07));
  border: 1px solid rgba(120,180,255,0.14); }
.file-card .f-name { font-size: 12px; color: #dbe7ff; padding: 0 9px 4px; }
.file-card .f-meta { font-size: 10px; color: #7d8db4; padding: 0 9px 11px; line-height: 1.4; }
.file-card .f-badge { position: absolute; top: 8px; right: 8px; z-index: 2; font-size: 9px; padding: 1px 5px; border-radius: 2px; }
.file-card .f-badge.global { color: #f0dfae; border: 1px solid rgba(226,200,140,0.55); background: rgba(40,32,12,0.6); }
.file-card .f-badge.local { color: #9fd8ff; border: 1px solid rgba(120,190,255,0.4); background: rgba(14,32,56,0.6); }
.file-card .f-new { position: absolute; left: 8px; top: 8px; z-index: 2; font-size: 9px; padding: 0 4px;
  border-radius: 2px; color: #1a1206; background: #e8b64c; }
.file-card:hover { transform: translateY(-5px); border-color: rgba(140,200,255,0.5); }
.file-card.on { transform: translateY(-10px); border-color: rgba(160,230,255,1);
  background:
    repeating-linear-gradient(90deg, rgba(140,200,255,0.09) 0 1px, transparent 1px 8px),
    linear-gradient(180deg, rgba(60,110,190,0.65), rgba(10,24,54,0.76));
  box-shadow: 0 0 28px rgba(90,180,255,0.42), inset 0 0 24px rgba(90,180,255,0.15); }
.file-card.on .f-icon { opacity: 1; filter: drop-shadow(0 0 10px rgba(150,215,255,0.85)); }
.file-card.empty { border-style: dashed; border-color: rgba(110,150,220,0.3); background: rgba(10,18,36,0.4); }
.file-card.empty .f-name { color: #62719a; }
.file-card.empty .f-icon { opacity: 0.28; }

.r-main { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 14px; min-height: 0; }
.r-list { display: flex; flex-direction: column; min-height: 0; border: 1px solid rgba(90,120,190,0.18);
  background: rgba(10,18,38,0.6); }
.r-list-head { padding: 9px 12px; font-size: 12px; color: #dcebff; letter-spacing: 1px;
  border-bottom: 1px solid rgba(110,170,240,0.3);
  background: linear-gradient(90deg, rgba(60,120,220,0.5), rgba(30,60,120,0.25)); }
.r-list-body { overflow-y: auto; flex: 1; padding: 4px 0; }
.sec-item { padding: 8px 12px; font-size: 12px; color: #9db0d6; cursor: pointer;
  display: flex; align-items: center; gap: 8px; border-left: 2px solid transparent; }
.sec-item i { font-style: normal; color: #5d6b8c; font-size: 10px; }
.sec-item em { font-style: normal; margin-left: auto; font-size: 9px; color: #1a1206; background: #e8b64c; padding: 0 4px; border-radius: 2px; }
.sec-item:hover { background: rgba(60,100,180,0.14); color: #cfe0ff; }
.sec-item.on { color: #eaf3ff; border-left-color: #6cd0ff; background: rgba(60,130,230,0.2); }

.r-detail { display: flex; flex-direction: column; min-height: 0; gap: 10px; position: relative;
  border: 1px solid rgba(110,170,240,0.32); background: rgba(14,28,58,0.62); padding: 16px 20px;
  box-shadow: inset 0 0 30px rgba(70,140,255,0.10); }
.r-detail h3 { margin: 0; font-size: 15px; font-weight: 600; color: #eaf2ff; letter-spacing: 1px; }
.r-meta { font-size: 11px; color: #6f80a8; word-break: break-all; }
#r-view { flex: 1; overflow: auto; margin: 0; font-size: 13px; line-height: 1.9; color: #cfdaf0;
  white-space: pre-wrap; word-break: break-word; font-family: inherit; }
#r-edit-area { flex: 1; resize: none; background: rgba(6,12,26,0.9); color: #d7e4ff;
  border: 1px solid rgba(110,160,240,0.35); padding: 12px; font-family: Consolas, monospace;
  font-size: 12.5px; line-height: 1.7; }
.r-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.r-empty svg { filter: drop-shadow(0 0 16px rgba(255,70,70,0.35)); }
.r-empty .e-title { font-size: 20px; letter-spacing: 12px; color: #ff7b7b; text-indent: 12px;
  text-shadow: 0 0 18px rgba(255,60,60,0.45); }
.r-empty .e-note { font-size: 12px; color: #c98f8f; max-width: 520px; text-align: center; line-height: 1.9; }
.r-empty .e-actions { display: flex; gap: 10px; margin-top: 4px; }
.r-empty button { font-size: 12px; padding: 6px 18px; cursor: pointer; border-radius: 2px;
  color: #ffd0d0; background: rgba(90,22,28,0.5); border: 1px solid rgba(255,120,120,0.5); }
.r-empty.teal svg { filter: drop-shadow(0 0 16px rgba(90,170,255,0.35)); }
.r-empty.teal .e-title { color: #dbe8ff; text-shadow: 0 0 18px rgba(90,170,255,0.35); }
.r-empty.teal .e-note { color: #8497bd; }
.r-empty button:hover { color: #fff; border-color: rgba(255,160,160,0.85); box-shadow: 0 0 14px rgba(255,80,80,0.35); }
.r-error button { margin-left: 10px; font-size: 12px; padding: 4px 12px; cursor: pointer;
  background: rgba(80,30,40,0.6); color: #ffd7d7; border: 1px solid rgba(255,140,140,0.45); border-radius: 2px; }
.hidden { display: none !important; }
</style>
</head>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const A = 2.62;        // 八字形的长半轴
  const B = 0.34;        // 上下起伏，给腰部的扭转留空间
  const HW = 0.19;       // 带子半宽

  // ---------- 八字 × 莫比乌斯 ----------
  // 中心线：xz 平面里的八字（Gerono 双纽线），再叠一层 y 方向起伏
  function center(t) {
    const c = Math.cos(t), s = Math.sin(t);
    // 长轴放到 z 上：俯视时就是竖着的八字，腰部收细、两瓣拉长
    return { x: 0.68 * Math.sin(2 * t), y: B * Math.sin(2 * t), z: A * c };
  }
  // 半个扭转的宽度方向：绕切线转 t/2
  function widthDir(t) {
    const e = 1e-3;
    const p0 = center(t - e), p1 = center(t + e);
    let tx = p1.x - p0.x, ty = p1.y - p0.y, tz = p1.z - p0.z;
    const tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl; ty /= tl; tz /= tl;
    // N = T × up
    let nx = ty * 0 - tz * 1, ny = tz * 0 - tx * 0, nz = tx * 1 - ty * 0;
    const nl = Math.hypot(nx, ny, nz) || 1;
    nx /= nl; ny /= nl; nz /= nl;
    // B = T × N
    const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
    const h = t / 2, ch = Math.cos(h), sh = Math.sin(h);
    return { x: nx * ch + bx * sh, y: ny * ch + by * sh, z: nz * ch + bz * sh };
  }

  // 预计算：1500 个采样点的中心线与宽度方向，星点只做查表
  const K = 1500;
  const LUT_C = new Float32Array(K * 3);
  const LUT_W = new Float32Array(K * 3);
  for (let i = 0; i < K; i++) {
    const t = (i / K) * TAU;
    const c = center(t), w = widthDir(t);
    LUT_C[i * 3] = c.x; LUT_C[i * 3 + 1] = c.y; LUT_C[i * 3 + 2] = c.z;
    LUT_W[i * 3] = w.x; LUT_W[i * 3 + 1] = w.y; LUT_W[i * 3 + 2] = w.z;
  }

  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(1.5, window.devicePixelRatio || 1);   // 上限 1.5，省一半像素
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 相机 ----------
  const cam = { yaw: 0.05, pitch: 1.32, dist: 5.9 };
  const target = { yaw: 0.05, pitch: 1.32, dist: 5.9 };
  let autoSpin = true;

  const qs = new URLSearchParams(location.search);
  for (const k of ['dist', 'pitch', 'yaw']) {
    if (qs.has(k)) {
      const v = Number(qs.get(k));
      if (Number.isFinite(v)) { cam[k] = v; target[k] = v; }
    }
  }

  let cyaw = 1, syaw = 0, cpitch = 1, spitch = 0, fscale = 1;

  // 相机焦点：点开一颗星时把镜头挪过去，实现"局部放大"
  const focus = { x: 0, y: 0, z: 0 };
  const focusTarget = { x: 0, y: 0, z: 0 };
  let focusDist = 5.9;          // 默认视距，退出局部放大时还原

  function updateCamera() {
    cyaw = Math.cos(cam.yaw); syaw = Math.sin(cam.yaw);
    cpitch = Math.cos(cam.pitch); spitch = Math.sin(cam.pitch);
    fscale = Math.min(W, H) * 0.92;
  }

  // 直接用数字算，避免每颗星建对象
  const proj = { x: 0, y: 0, z: 0, s: 1 };
  function projectXYZ(wx, wy, wz) {
    const x = wx - focus.x, y = wy - focus.y, z = wz - focus.z;
    const rx = x * cyaw - z * syaw;
    const rz = x * syaw + z * cyaw;
    const ry = y * cpitch - rz * spitch;
    const dz = y * spitch + rz * cpitch;
    const persp = fscale / Math.max(0.85, cam.dist - dz);
    proj.x = W / 2 + rx * persp;
    proj.y = H / 2 + ry * persp;
    proj.z = dz;
    proj.s = (persp * cam.dist) / fscale;
    return proj;
  }
  // projectXYZ 写的是共用对象，热路径（三万颗星）靠它避免分配。
  // 凡是"要把结果存起来"的地方都走 project()，它返回一份拷贝——
  // 否则所有节点会共用同一个坐标对象，看起来就像只有一颗星。
  function project(p) {
    const q = projectXYZ(p.x, p.y, p.z);
    return { x: q.x, y: q.y, z: q.z, s: q.s };
  }

  // ---------- 数据 ----------
  let NODES = [], EDGES = [], LAYERS = [], META = {};
  let byId = new Map();
  const hidden = new Set();          // 按层隐藏（保留给以后用）
  const hiddenWs = new Set();        // 按工作区隐藏
  let WS = [];                       // [{id,label,count,color}]
  const WS_COLORS = ['#ff9ecb', '#7fe6ff', '#ffd27a', '#b39dff', '#8ef0c9', '#ffb07a', '#9fd6ff', '#ff8f8f'];

  // "D-DSHWORK" → "D:\DSHWORK"
  function wsLabel(id) {
    const m = /^([A-Za-z])-(.*)$/.exec(id || '');
    if (m) return `${m[1]}:\\${m[2].replace(/-/g, '\\')}`;
    return String(id || '未分类');
  }
  function wsColor(id) {
    const i = WS.findIndex((w) => w.id === id);
    return i >= 0 ? WS[i].color : '#9fb0d0';
  }
  const visible = (n) => !hidden.has(n.level) && !hiddenWs.has(n.workspace);
  let selected = null, hovered = null, hits = [], query = '';

  // 开场动画：星系从腰开始一点点铺开，星星一颗一颗亮
  const INTRO_MS = 2600;
  const T0 = performance.now();
  let intro = 0;
  let introDone = false;

  const FALLBACK_LAYERS = [
    { id: 'soul', name: '身份', color: '#ffd27a' },
    { id: 'rules', name: '规矩', color: '#7fe6ff' },
    { id: 'project', name: '项目', color: '#b39dff' },
    { id: 'event', name: '事件', color: '#ff9ecb' },
    { id: 'fact', name: '知识', color: '#8ef0c9' },
    { id: 'feeling', name: '感受', color: '#ffb07a' },
  ];
  const layerOf = (id) => LAYERS.find((l) => l.id === id) || { id, name: id, color: '#cfd9ff' };

  function laneOf(level) {
    const i = LAYERS.findIndex((l) => l.id === level);
    const n = Math.max(1, LAYERS.length - 1);
    return ((i < 0 ? 0 : i) / n - 0.5) * HW * 0.85;
  }

  async function load() {
    const res = await fetch('api/graph');
    const d = await res.json();
    META = d.meta || {};
    if (Number.isInteger(META.rev)) REV = META.rev;
    NODES = d.nodes || [];
    EDGES = d.edges || [];
    LAYERS = (META.layers && META.layers.length) ? META.layers : FALLBACK_LAYERS;
    NODES.forEach((n, i) => { n.i = i; n.s = laneOf(n.level); });
    byId = new Map(NODES.map((n) => [n.id, n]));
    buildLegend();
    stats();
    seedStars();
    if (!NODES.length) document.getElementById('empty').style.display = 'grid';
  }

  function stats() {
    const el = document.getElementById('stats');
    if (!META.nodes) return;
    const hidden = META.hidden || 0;
    el.innerHTML = `会话 ${META.sessions} · 星 ${META.nodes} · 线 ${META.edges}`
      + (hidden ? ` · <span id="hidden-n" title="点一下恢复全部">隐藏 ${hidden}</span>` : '');
    const hn = document.getElementById('hidden-n');
    if (hn) {
      hn.style.cssText = 'cursor:pointer;text-decoration:underline dotted';
      hn.addEventListener('click', () => apiOverrides('reset'));
    }
  }

  // ---------- 写入：隐藏一条 / 改概要 ----------
  // 带 rev 的乐观并发：缺 rev 宿主回 400，过期回 409（别处刚改过），成功后重新拉一遍图。
  let REV = 0;

  async function apiOverrides(action, payload = {}) {
    const res = await fetch('api/overrides', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ rev: REV, action, ...payload }),
    });
    if (res.status === 409) {
      const d = await res.json().catch(() => ({}));
      REV = d.state?.rev ?? REV;
      await load();                       // 拉回别处的最新状态，再让用户重试
      return { ok: false, error: 'stale' };
    }
    if (!res.ok) return { ok: false, error: 'http-' + res.status };
    const state = await res.json();
    REV = state.rev ?? REV + 1;
    await load();
    return { ok: true, state };
  }

  // ---------- 星带：查表，无三角函数 ----------
  const STAR_N = 32000;
  const starT = new Float32Array(STAR_N);     // 采样索引
  const starS = new Float32Array(STAR_N);     // 带子横向位置
  const starA = new Float32Array(STAR_N);     // 亮度
  const starR = new Float32Array(STAR_N);     // 尺寸
  const starCol = new Uint8Array(STAR_N);     // 颜色索引
  const starThr = new Float32Array(STAR_N);   // 开场点亮的时机（0=腰，1=两端）
  const PALETTE = [
    [255, 255, 255],
    [255, 198, 110],
    [118, 202, 255],
    [172, 130, 255],
    [255, 150, 200],
    [110, 255, 216],
  ];
  const FAR = [];

  const BY_COLOR = [[], [], [], [], [], []];
  function seedStars() {
    for (const g of BY_COLOR) g.length = 0;
    for (let i = 0; i < STAR_N; i++) {
      const g = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      starT[i] = Math.random() * K;
      starS[i] = g * HW;
      starA[i] = 0.16 + Math.random() * 0.55;
      starR[i] = 0.32 + Math.random() * 0.85;
      // 腰部先亮，再顺着两瓣往两头铺；乘 0.92 给最后一点收尾时间
      starThr[i] = Math.abs(Math.cos((starT[i] / K) * Math.PI * 2)) * 0.92 + (i % 7) * 0.0018;
      // 颜色沿带子分段：金 → 粉 → 紫 → 青 → 青绿 → 白，像一条会变色的光
      const jitter = (Math.random() - 0.5) * 1.1;
      const c = ((Math.floor((starT[i] / K) * 6.5 + jitter) % 6) + 6) % 6;
      starCol[i] = c;
      BY_COLOR[c].push(i);
    }
    FAR.length = 0;
    for (let i = 0; i < 360; i++) {
      const ang = Math.random() * TAU;
      const rad = 1.3 + Math.random() * 1.8;
      FAR.push({
        x: Math.cos(ang) * rad,
        y: (Math.random() - 0.5) * 1.3,
        z: Math.sin(ang) * rad * 0.7,
        size: 0.2 + Math.random() * 0.55,
        a: 0.05 + Math.random() * 0.25,
        tw: Math.random() * TAU,
      });
    }
  }

  // ---------- 星核 ----------
  function drawCore(t) {
    const p = projectXYZ(0, 0, 0);
    const pulse = 0.9 + 0.1 * Math.sin(t * 1.2);
    const r = Math.min(W, H) * 0.12 * pulse;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.1, 'rgba(232,242,255,0.55)');
    g.addColorStop(0.35, 'rgba(150,190,255,0.14)');
    g.addColorStop(1, 'rgba(60,90,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();

    const lenH = Math.min(W, H) * 0.17 * pulse;
    const lenV = Math.min(W, H) * 0.085 * pulse;
    for (const [len, wid, rot] of [[lenH, 1.5, 0], [lenV, 1.0, Math.PI / 2]]) {
      const lg = ctx.createLinearGradient(-len, 0, len, 0);
      lg.addColorStop(0, 'rgba(160,200,255,0)');
      lg.addColorStop(0.5, 'rgba(255,255,255,0.75)');
      lg.addColorStop(1, 'rgba(160,200,255,0)');
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(rot);
      ctx.fillStyle = lg;
      ctx.fillRect(-len, -wid / 2, len * 2, wid);
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- 绘制 ----------
  function drawSky(t) {
    // 每帧先把合成模式复位，任何一处漏掉的 'lighter' 都会让背景越叠越白
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#020308';
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.62);
    g.addColorStop(0, 'rgba(12, 22, 52, 0.5)');
    g.addColorStop(0.5, 'rgba(5, 9, 22, 0.32)');
    g.addColorStop(1, 'rgba(1, 2, 6, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const f of FAR) {
      const p = project(f);
      const a = f.a * (0.5 + 0.5 * Math.sin(t * 1.1 + f.tw));
      ctx.fillStyle = `rgba(200,215,255,${a.toFixed(3)})`;
      const s = Math.max(0.4, f.size * p.s * 2.4);
      ctx.fillRect(p.x, p.y, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // 流动相位：星尘和记忆星共用同一个偏移，一起沿带子走
  let flowIdx = 0;        // 单位是查表下标（0..K）
  let flowRate = 1;       // 1 = 正常流；选中某颗星时降到 0，定格
  let lastFrame = 0;

  function drawStars(t) {
    const flow = flowIdx;
    ctx.globalCompositeOperation = 'lighter';
    for (let c = 0; c < 6; c++) {
      const col = PALETTE[c];
      const baseA = c === 0 ? 0.5 : 0.85;   // 白色稍暗一点，彩色更明显
      ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${baseA})`;
      const list = BY_COLOR[c];
      for (let n = 0; n < list.length; n++) {
        const i = list[n];
        let fade = 1;
        if (!introDone) {
          const d = intro - starThr[i];
          if (d <= 0) continue;
          fade = d > 0.1 ? 1 : d / 0.1;      // 前沿 10% 渐亮，别切一刀
        }
        let idx = starT[i] + flow;
        idx = idx % K;
        const i0 = idx | 0;
        const i1 = i0 + 1 === K ? 0 : i0 + 1;
        const f = idx - i0;
        const o0 = i0 * 3, o1 = i1 * 3;
        const s = starS[i];
        const cx = LUT_C[o0] + (LUT_C[o1] - LUT_C[o0]) * f + s * (LUT_W[o0] + (LUT_W[o1] - LUT_W[o0]) * f);
        const cy = LUT_C[o0 + 1] + (LUT_C[o1 + 1] - LUT_C[o0 + 1]) * f + s * (LUT_W[o0 + 1] + (LUT_W[o1 + 1] - LUT_W[o0 + 1]) * f);
        const cz = LUT_C[o0 + 2] + (LUT_C[o1 + 2] - LUT_C[o0 + 2]) * f + s * (LUT_W[o0 + 2] + (LUT_W[o1 + 2] - LUT_W[o0 + 2]) * f);
        const p = projectXYZ(cx, cy, cz);
        const depth = 0.25 + 0.75 * Math.min(1, Math.max(0, (p.z + 0.55) / 1.2));
        const wave = 0.75 + 0.25 * Math.sin((idx / K) * 8 - t * 1.6);
        let boost = 1;
        if (!introDone && intro - starThr[i] < 0.06) boost = 2.4;
        const sz = Math.min(3.4, Math.max(0.4, starR[i] * p.s * 1.1 * depth * wave * (c ? 1.35 : 1) * boost));
        // 靠近画面边缘时淡出，别让带子被窗口切出一条硬边
        const ed = Math.min(p.x, W - p.x, p.y, H - p.y);
        const edge = ed < 90 ? Math.max(0, ed / 90) : 1;
        const alpha = fade * edge;
        if (alpha < 1) ctx.globalAlpha = alpha;
        ctx.fillRect(p.x - sz * 0.5, p.y - sz * 0.5, sz, sz);
        if (alpha < 1) ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function nodePos(n) {
    // 和星尘用同一个流动相位，所以记忆星会跟着带子一起走
    const t = n.u + flowIdx * (TAU / K);
    const c = center(t), w = widthDir(t);
    return { x: c.x + n.s * w.x, y: c.y + n.s * w.y, z: c.z + n.s * w.z };
  }

  const GLOWS = new Map();
  function glowSprite(color) {
    let c = GLOWS.get(color);
    if (c) return c;
    const size = 64;
    c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, hexA(color, 0.55));
    grd.addColorStop(0.45, hexA(color, 0.10));
    grd.addColorStop(1, hexA(color, 0));
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    GLOWS.set(color, c);
    return c;
  }

  function drawNodes(t) {
    const hitSet = new Set(hits.map((h) => h.index));
    const order = NODES.filter(visible)
      .map((n) => ({ n, p: project(nodePos(n)) }))
      .sort((a, b) => a.p.z - b.p.z);

    const nodeFade = Math.min(1, Math.max(0, (intro - 0.72) / 0.28));
    if (nodeFade <= 0) return;

    // 放大到 2.6→2.2 之间逐渐显形；悬停、选中、搜索命中的那颗始终全亮
    const reveal = Math.min(1, Math.max(0, (2.6 - cam.dist) / 0.4));
    const grow = 1 + 0.5 * reveal;

    // 不再挖暗底：记忆星就是一颗亮一点的星，压在星带上也不抠洞
    const items = [];
    for (const { n, p } of order) {
      const isSel = selected && selected.id === n.id;
      const isHit = hitSet.has(n.i);
      const isHov = hovered && hovered.id === n.id;
      const focus = isSel || isHit || isHov;
      const baseA = focus ? 1 : (0.55 + 0.45 * reveal);
      const depth = Math.min(1, Math.max(0, (p.z + 0.6) / 1.2));
      const r = (2.0 + n.imp * 1.7) * grow * (isSel ? 2.0 : isHit ? 1.4 : isHov ? 1.3 : 1);
      items.push({
        n, p, isSel, isHit, r,
        color: layerOf(n.level).color,
        a: (0.45 + depth * 0.55) * nodeFade * baseA,
      });
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const it of items) {
      const { p, r, a } = it;
      ctx.strokeStyle = hexA(it.color, 0.9 * a);
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(p.x - r, p.y); ctx.lineTo(p.x + r, p.y);
      ctx.moveTo(p.x, p.y - r * 0.85); ctx.lineTo(p.x, p.y + r * 0.85);
      ctx.stroke();

      ctx.fillStyle = `rgba(255,255,255,${(0.95 * a).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.8, r * 0.34), 0, TAU); ctx.fill();

      if (it.isHit || it.isSel) {
        ctx.strokeStyle = hexA(it.isSel ? '#ffffff' : it.color, 0.7);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.9 + 3, 0, TAU); ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';   // 别把这个状态漏到下一帧
  }

  // 星图上显示的是"概要"：第一句话，点开右侧才是全文
  function drawLabels() {
    if (cam.dist > 2.4 && !hovered) return;
    const pool = hovered ? [hovered] : NODES.slice().sort((a, b) => b.imp - a.imp).slice(0, 14);
    ctx.font = '11px "Microsoft YaHei", system-ui, sans-serif';
    ctx.textAlign = 'center';
    const boxes = [];
    for (const n of pool) {
      if (!visible(n)) continue;
      const p = project(nodePos(n));
      const label = shortLabel(n.summary || n.text, 18);
      if (!label) continue;
      const w = ctx.measureText(label).width;
      if (w > 200) continue;
      const box = [p.x - w / 2 - 4, p.y - 26, w + 8, 15];
      if (boxes.some((b) => !(box[0] > b[0] + b[2] || box[0] + box[2] < b[0] || box[1] > b[1] + b[3] || box[1] + box[3] < b[1]))) continue;
      boxes.push(box);
      ctx.fillStyle = 'rgba(4, 8, 18, 0.55)';
      ctx.fillRect(box[0], box[1], box[2], box[3]);
      ctx.fillStyle = 'rgba(214, 228, 255, 0.82)';
      ctx.fillText(label, p.x, p.y - 14);
    }
  }

  function hexA(hex, a) {
    const h = String(hex).replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  }
  function shortLabel(text, n = 12) {
    const t = String(text || '').replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, n) + '…' : t;
  }

  // ---------- 诊断旁路 ----------
  // 每 5 秒把帧率、画布尺寸、节点数和最近的报错推给宿主（只存内存、不落盘）。
  // 排查"卡顿/白屏"时先看这个，别靠猜。
  const diag = { frames: 0, from: performance.now(), fps: 0, errors: [] };
  window.addEventListener('error', (e) => {
    diag.errors.push(String(e.message || e.error || 'unknown'));
    if (diag.errors.length > 5) diag.errors.shift();
  });

  function sendReport() {
    const now = performance.now();
    const dt = (now - diag.from) / 1000;
    diag.fps = dt > 0 ? Number((diag.frames / dt).toFixed(1)) : 0;
    diag.frames = 0;
    diag.from = now;
    const body = JSON.stringify({
      kind: 'mobius-report',
      fps: diag.fps,
      canvas: [canvas.width, canvas.height],
      dpr: Number((window.devicePixelRatio || 1).toFixed(2)),
      nodes: NODES.length,
      dist: Number(cam.dist.toFixed(2)),
      intro: Number(intro.toFixed(2)),
      errors: diag.errors.slice(-3),
      ts: Date.now(),
    });
    fetch('api/report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body,
    }).catch(() => { /* 诊断失败不影响画面 */ });
  }
  setInterval(sendReport, 5000);

  // ---------- 主循环 ----------
  function frame(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, lastFrame ? (now - lastFrame) / 1000 : 0.016);
    lastFrame = now;
    diag.frames++;

    // 流动：星尘和记忆星一起沿带子走；选中某颗时慢慢停住，方便看
    flowRate += ((selected ? 0 : 1) - flowRate) * 0.07;
    flowIdx = (flowIdx + dt * 26 * flowRate) % K;

    intro = Math.min(1, (now - T0) / INTRO_MS);
    if (intro >= 1) introDone = true;
    if (!dragging && (Math.abs(vYaw) > 0.00015 || Math.abs(vPitch) > 0.00015)) {
      target.yaw += vYaw;
      target.pitch += vPitch;
      vYaw *= 0.93;
      vPitch *= 0.93;
    } else if (autoSpin) {
      target.yaw += 0.0011;
    }
    const k = stage === 'morph' ? 0.26 : (dragging ? 0.35 : 0.12);   // 凝缩时相机跟得更紧
    cam.yaw += (target.yaw - cam.yaw) * k;
    cam.pitch += (target.pitch - cam.pitch) * k;
    cam.dist += (target.dist - cam.dist) * 0.12;
    // 焦点平移：点开一颗星时镜头会挪到它身上
    const fk = 0.1;
    focus.x += (focusTarget.x - focus.x) * fk;
    focus.y += (focusTarget.y - focus.y) * fk;
    focus.z += (focusTarget.z - focus.z) * fk;
    updateCamera();

    // 三幕推进
    if (qs.get('lock') !== null) {
      stage = 'morph';
      morphT = Math.max(0, Math.min(0.999, Number(qs.get('lock')) || 0));
    } else if (stage === 'morph') {
      morphT = Math.max(0, Math.min(1, morphT + (dt / MORPH_SECONDS) * morphDir));
      focusTarget.x *= 0.8; focusTarget.y *= 0.8; focusTarget.z *= 0.8;
      // 凝缩同时把视角复位：转到正面、拉回默认距离，之后缩小才对得上图标
      target.yaw += (0 - target.yaw) * 0.18;
      target.pitch += (1.32 - target.pitch) * 0.18;
      target.dist += (5.9 - target.dist) * 0.18;
      if (morphT >= 1) stage = 'symbol';
      else if (morphT <= 0) { stage = 'galaxy'; setChrome(true); }
    }
    spin += dt * 0.18;
    const wantHover = (stage === 'selected' || stage === 'panel' || (stage === 'symbol' && symbolHover)) ? 1 : 0;
    hoverAmt += (wantHover - hoverAmt) * Math.min(1, dt * 7);
    if (wantHover) sweep = (sweep + dt / (stage === 'symbol' ? 1.2 : 2.6)) % 1;
    iconSpin += dt * 0.18 * hoverAmt;

    const st = stageInfo();
    drawSky(t);
    if (st.a > 0.01) {
      if (st.k < 0.999) {
        const cx = W / 2, cy = H / 2;
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(st.roll || 0); ctx.scale(st.k, st.k); ctx.translate(-cx, -cy);
        ctx.globalAlpha = st.a;
        drawCore(t);
        if (qs.get('stars') !== '0') drawStars(t);
        drawNodes(t);
        ctx.globalAlpha = 1;
        ctx.restore();
      } else {
        drawCore(t);
        if (qs.get('stars') !== '0') drawStars(t);
        drawNodes(t);
        drawLabels();
      }
    }

    // 图标：凝缩时贴住星带的实测包围盒，稳定后归位到屏幕正中
    if (qs.get('icon') !== '0' && st.inf > 0.02) {
      let view = null;
      if (stage === 'morph') {
        const b = bandBounds();
        if (b) {
          const settle = clamp01((morphT - 0.94) / 0.06);
          view = {
            cx: W / 2,
            cy: H / 2,
            size: Math.max(24, b.w / 1.24) * (1 - settle) + SYMBOL_PX * settle,
          };
        }
      }
      drawInfinity(st.inf, t, view);
    }

    requestAnimationFrame(frame);
  }

  // ---------- 三幕：定格凝缩 → ∞ 徽标 → 规则区 ----------
  const SYMBOL_PX = 172;          // = 徽标 86 × 2
  const MORPH_SECONDS = 2.0;
  let stage = 'galaxy';           // galaxy | morph | symbol | selected | panel
  let morphT = 0, morphDir = 1, sweep = 0, spin = 0, symbolHover = false, hoverAmt = 0, iconSpin = 0;
  let rulesData = null, rulesIdx = 0, rulesEditing = false, rulesSec = 0, rulesMtime = 0, rulesPath = '';

  const easeIO = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  // 星带当前在屏幕上的包围盒（只在凝缩时用，1100 个点够快）
  function bandBounds() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const n of NODES) {
      if (!visible(n)) continue;
      const p = project(nodePos(n));
      if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x;
      if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y;
    }
    if (x0 > x1) return null;
    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
  }

  function stageInfo() {
    if (stage === 'galaxy') return { k: 1, a: 1, inf: 0, roll: 0, infS: 1 };
    if (stage === 'morph') {
      const e = easeIO(morphT);
      // 缩到 0.24：实测这个比例下星带在屏幕上正好 172px，与图标同宽；
      // 然后两者原位交叉淡入，视觉上就是「星带收成图标」
      return {
        k: 1 - 0.76 * e,
        roll: -Math.PI / 2 * e,
        a: qs.get('band') === '1' ? 1 : 1 - clamp01((morphT - 0.9) / 0.1),
        inf: clamp01((morphT - 0.9) / 0.1),
        infS: 1,
      };
    }
    return { k: 0, a: 0, inf: 1, roll: -Math.PI / 2, infS: 1 };
  }

  // ---- ∞ 徽标：沿曲线逐段上色，接近素材里的青→紫→黄丝带 ----
  const hex2rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mixHex = (a, b, t) => {
    const p = hex2rgb(a), q = hex2rgb(b);
    return 'rgb(' + Math.round(p[0] + (q[0] - p[0]) * t) + ',' + Math.round(p[1] + (q[1] - p[1]) * t) + ',' + Math.round(p[2] + (q[2] - p[2]) * t) + ')';
  };
  const RIBBON = ['#2fdcff', '#4bffd2', '#b96bff', '#ff56cc', '#ffe04d', '#a6ff5e'];
  function ribbonColor(x01) {
    const v = Math.max(0, Math.min(1, x01)) * (RIBBON.length - 1);
    const i = Math.min(RIBBON.length - 2, Math.floor(v));
    return mixHex(RIBBON[i], RIBBON[i + 1], v - i);
  }

  function drawInfinity(alpha, t, view) {
    const cx = view && view.cx != null ? view.cx : W / 2;
    const cy = view && view.cy != null ? view.cy : H / 2;
    const hover = hoverAmt;
    const selNow = stage === 'selected' || stage === 'panel';
    const size = (view && view.size ? view.size : SYMBOL_PX) * (1 + 0.03 * hover);
    const A = size * 0.5, B = size * 0.22;
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
    const k = 1 + 0.25 * hover;

    // 曲线与法线
    const pt = (u) => ({ x: A * Math.sin(u), y: B * Math.sin(u) * Math.cos(u) });
    const dpt = (u) => ({ x: A * Math.cos(u), y: B * (Math.cos(u) * Math.cos(u) - Math.sin(u) * Math.sin(u)) });
    const norm = (u) => { const d = dpt(u), L = Math.hypot(d.x, d.y) || 1; return { x: -d.y / L, y: d.x / L }; };

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(cx, cy);

    // 背景：紫蓝星云（没有边界），加满屏放射细线
    const neb = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.15);
    neb.addColorStop(0, `rgba(120,110,255,${0.30 * alpha})`);
    neb.addColorStop(0.35, `rgba(96,80,220,${0.16 * alpha})`);
    neb.addColorStop(0.7, `rgba(64,48,170,${0.06 * alpha})`);
    neb.addColorStop(1, 'rgba(30,20,90,0)');
    ctx.fillStyle = neb;
    ctx.beginPath(); ctx.arc(0, 0, size * 1.15, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + spin * 0.1;
      const len = size * (0.55 + 0.5 * ((i * 37) % 100) / 100);
      const g = ctx.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
      g.addColorStop(0, `rgba(200,215,255,${0.16 * alpha * k})`);
      g.addColorStop(1, 'rgba(160,180,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.stroke();
    }

    // 金色粗环 + 四角：视频里悬停/选中时才浮现的这一圈
    const R = size * 0.62;
    const ringA = (0.06 + 0.92 * hover) * alpha;   // 静止时几乎不可见，悬停/选中才亮起来
    const gold = ctx.createLinearGradient(-R, -R, R, R);
    gold.addColorStop(0, '#f6e6b8');
    gold.addColorStop(0.35, '#d8b367');
    gold.addColorStop(0.6, '#f3dfa6');
    gold.addColorStop(1, '#a97f36');

    // 主环（粗）
    ctx.strokeStyle = gold;
    ctx.globalAlpha = ringA;
    ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
    // 环内冷光盘
    const disc = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.95);
    disc.addColorStop(0, `rgba(70,110,220,${0.22 * alpha * (1 + hover * 0.5)})`);
    disc.addColorStop(0.6, `rgba(40,70,160,${0.14 * alpha})`);
    disc.addColorStop(1, 'rgba(20,40,110,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.95, 0, Math.PI * 2); ctx.fill();
    // 内侧细环
    ctx.globalAlpha = ringA * 0.45;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, R * 0.86, 0, Math.PI * 2); ctx.stroke();

    // 环上细刻度
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      const big = i % 6 === 0;
      ctx.globalAlpha = ringA * (big ? 0.85 : 0.35);
      ctx.strokeStyle = '#f0d9a0';
      ctx.lineWidth = big ? 1.6 : 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.lineTo(Math.cos(a) * (R + (big ? 7 : 3)), Math.sin(a) * (R + (big ? 7 : 3)));
      ctx.stroke();
    }

    // 四角：45° 方向的尖角装饰
    for (let i = 0; i < 4; i++) {
      const a = Math.PI / 4 + (i / 4) * Math.PI * 2;
      const tip = R * (1.26 + 0.06 * hover);
      const w = R * 0.11;
      ctx.globalAlpha = ringA;
      ctx.fillStyle = gold;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.99 - Math.sin(a) * w, Math.sin(a) * R * 0.99 + Math.cos(a) * w);
      ctx.lineTo(Math.cos(a) * tip, Math.sin(a) * tip);
      ctx.lineTo(Math.cos(a) * R * 0.99 + Math.sin(a) * w, Math.sin(a) * R * 0.99 - Math.cos(a) * w);
      ctx.closePath();
      ctx.fill();
      // 尖端的小亮点
      ctx.globalAlpha = ringA * 0.9;
      ctx.fillStyle = '#fff6dd';
      ctx.beginPath(); ctx.arc(Math.cos(a) * tip, Math.sin(a) * tip, 1.6, 0, Math.PI * 2); ctx.fill();
    }

    // 悬停时沿环走的一道高光
    if (hover > 0.05) {
      const head = sweep * Math.PI * 2 - Math.PI / 2;
      const span = 1.2;
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3.4;
      for (let i = 0; i < 16; i++) {
        const a0 = head - span + span * (i / 16);
        ctx.strokeStyle = 'rgba(255,246,220,' + (0.55 * hover * alpha * Math.pow(i / 16, 2)).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(0, 0, R, a0, a0 + span / 16 + 0.003); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // 笔刷丝带：沿法线做多边形填充（宽、边缘毛糙）
    const grad = ctx.createLinearGradient(-A, 0, A, 0);
    grad.addColorStop(0.00, '#57e8ff');
    grad.addColorStop(0.18, '#8ef7ff');
    grad.addColorStop(0.34, '#ff8ad8');
    grad.addColorStop(0.50, '#fff4ff');
    grad.addColorStop(0.66, '#ffe98a');
    grad.addColorStop(0.84, '#f7ff9c');
    grad.addColorStop(1.00, '#9dff8a');

    const bandPath = (half, seedPhase) => {
      const N = 96;
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const u = (i / N) * Math.PI * 2;
        const q = pt(u), n = norm(u);
        // 宽度剖面：两端粗、交点细；再用正弦加点毛糙
        const w = half * (0.28 + 0.72 * Math.abs(Math.sin(u)))
          * (0.85 + 0.15 * Math.sin(u * 9 + seedPhase));
        i ? ctx.lineTo(q.x + n.x * w, q.y + n.y * w) : ctx.moveTo(q.x + n.x * w, q.y + n.y * w);
      }
      for (let i = N; i >= 0; i--) {
        const u = (i / N) * Math.PI * 2;
        const q = pt(u), n = norm(u);
        const w = half * (0.28 + 0.72 * Math.abs(Math.sin(u)))
          * (0.85 + 0.15 * Math.sin(u * 9 + seedPhase + 2.1));
        ctx.lineTo(q.x - n.x * w, q.y - n.y * w);
      }
      ctx.closePath();
    };

    // 笔刷：沿曲线一路盖章，半径随位置变化，实心不出空心
    const BW = size * 0.03;    // 丝带半宽
    const stamp = (radiusScale, alphaMul) => {
      for (let i = 0; i <= 200; i++) {
        const u = (i / 200) * Math.PI * 2;
        const q = pt(u), n = norm(u);
        const r = BW * radiusScale * (0.32 + 0.78 * Math.abs(Math.sin(u)));
        const col = ribbonColor((q.x + A) / (2 * A));
        ctx.globalAlpha = alpha * alphaMul;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
      }
    };
    // 外晕（加法） → 实心（正常叠色）
    stamp(2.6, 0.10);
    stamp(1.7, 0.14);
    ctx.globalCompositeOperation = 'source-over';
    stamp(1.0, 0.95);
    ctx.globalCompositeOperation = 'lighter';

    // 边缘的颗粒（干笔触感）
    for (let i = 0; i < 260; i++) {
      const u = (i / 260) * Math.PI * 2 + (i % 7) * 0.03;
      const q = pt(u), n = norm(u);
      const w = BW * (0.3 + 0.75 * Math.abs(Math.sin(u))) * (1.15 + 1.5 * ((i * 31) % 100) / 100);
      const side = i % 2 ? 1 : -1;
      const px = q.x + n.x * w * side, py = q.y + n.y * w * side;
      ctx.globalAlpha = alpha * (0.06 + 0.12 * ((i * 17) % 100) / 100);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px, py, 1.1, 1.1);
    }

    // 中央四角星芒
    ctx.globalAlpha = 1;
    const coreR = size * (0.15 + 0.02 * pulse) * k;
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 2.2);
    cg.addColorStop(0, `rgba(255,255,255,${alpha})`);
    cg.addColorStop(0.35, `rgba(235,240,255,${0.5 * alpha})`);
    cg.addColorStop(1, 'rgba(150,170,255,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, coreR * 2.2, 0, Math.PI * 2); ctx.fill();

    // 四根主光芒（上下左右）+ 八根短的
    const spikes = [[0, 0.34, 2.6, 0.9], [Math.PI, 0.34, 2.6, 0.9], [Math.PI / 2, 0.28, 2.4, 0.85], [-Math.PI / 2, 0.28, 2.4, 0.85]];
    for (const [a0, lenF, wid, al] of spikes) {
      const ang = a0 + iconSpin;
      const len = size * lenF * k * (1 + 0.05 * pulse);
      const g = ctx.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len);
      g.addColorStop(0, `rgba(255,255,255,${al * alpha})`);
      g.addColorStop(1, 'rgba(220,235,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = wid;
      ctx.beginPath(); ctx.moveTo(-Math.cos(ang) * len * 0.55, -Math.sin(ang) * len * 0.55);
      ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len); ctx.stroke();
    }
    for (let i = 0; i < 8; i++) {
      const ang = (Math.PI / 4) + (i / 8) * Math.PI * 2 + iconSpin * 1.2;
      const len = size * 0.13 * k;
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * alpha})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len); ctx.stroke();
    }

    ctx.restore();

    // 标题与细线（不跟着转）
    if (alpha > 0.5) {
      const ty = cy + size * 0.62 + 40;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = selNow ? '#eef5ff' : '#cfd9f5';
      ctx.font = '600 15px "Microsoft YaHei", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('如我所书', cx, ty);
      const ruleW = 78;
      ctx.strokeStyle = 'rgba(150,180,240,0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx - ruleW, ty - 20); ctx.lineTo(cx + ruleW, ty - 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - ruleW, ty + 9); ctx.lineTo(cx + ruleW, ty + 9); ctx.stroke();
      ctx.fillStyle = '#e2c88c';
      ctx.beginPath(); ctx.arc(cx - ruleW - 6, ty - 5, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function setChrome(show) {
    for (const el of [document.getElementById('legend'), document.getElementById('stats')]) {
      if (el) el.style.opacity = show ? '' : '0';
      if (el) el.style.transition = 'opacity .4s';
    }
    const search = document.getElementById('search');
    if (search) { search.style.opacity = show ? '' : '0'; search.style.transition = 'opacity .4s'; search.style.pointerEvents = show ? '' : 'none'; }
  }

  function startMorph() {
    if (stage !== 'galaxy') return;
    autoSpin = false; vYaw = 0; vPitch = 0; target.yaw = 0;
    setChrome(false);
    document.getElementById('detail').classList.remove('on');
    stage = 'morph'; morphT = 0; morphDir = 1; sweep = 0;
    selected = null;
    document.getElementById('detail').classList.remove('on');
  }
  function backToGalaxy() {
    if (stage === 'galaxy') return;
    if (stage === 'panel') closeRules();
    stage = 'morph'; morphT = 1; morphDir = -1;
  }

  // ---------- 规则区 ----------
  const R = (id) => document.getElementById(id);
  const fresh = (ms) => Date.now() - ms < 24 * 3600 * 1000;
  const baseName = (p) => String(p || '').split(/[\\/]/).filter(Boolean).pop() || '';

  async function openRules() {
    stage = 'panel';
    R('rules').classList.remove('hidden');
    canvas.style.filter = 'blur(8px) brightness(.35)';
    await loadRules();
  }
  function closeRules() {
    stage = 'selected';
    R('rules').classList.add('hidden');
    canvas.style.filter = '';
  }

  const FOLDER_SVG = [
    '<svg width="236" height="176" viewBox="0 0 236 176" fill="none">',
    '<path d="M22 40 L22 30 Q22 24 30 24 L92 24 Q98 24 102 30 L110 40"',
    ' stroke="rgba(255,120,120,0.6)" stroke-width="2" stroke-linejoin="round"/>',
    '<rect x="18" y="38" width="200" height="118" rx="8"',
    ' fill="rgba(64,18,26,0.35)" stroke="rgba(255,120,120,0.7)" stroke-width="2"/>',
    '<rect x="40" y="52" width="156" height="82" rx="7"',
    ' fill="rgba(40,10,18,0.45)" stroke="rgba(255,140,140,0.35)" stroke-width="1.5"/>',
    '<path d="M64 70 L172 118 M172 70 L64 118" stroke="rgba(255,90,90,0.9)" stroke-width="2.6" stroke-linecap="round"/>',
    '</svg>',
  ].join('');

  function showError(msg) {
    R('r-note').textContent = '读取失败';
    R('r-note').style.color = '#ff7b7b';
    R('r-title').textContent = '';
    R('r-cabinet').style.display = 'none';
    R('r-edit').disabled = true;
    R('r-save').disabled = true;
    const aside = document.querySelector('.r-list');
    if (aside) aside.style.display = 'none';
    const main = document.querySelector('.r-main');
    if (main) main.style.gridTemplateColumns = '1fr';
    R('r-view').style.flex = '1';
    R('r-meta').textContent = '';
    R('r-list').innerHTML = '';
    R('r-list-head').textContent = '小节';
    R('r-view').classList.remove('hidden');
    R('r-view').innerHTML = '<div class="r-empty">' + FOLDER_SVG
      + '<div class="e-title">读取失败</div>'
      + '<div class="e-note">' + msg + '</div>'
      + '<div class="e-actions"><button id="r-retry">重试</button></div></div>';
    const b = document.getElementById('r-retry');
    if (b) b.onclick = () => loadRules();
  }

  async function loadRules() {
    let res;
    try {
      res = await fetch('api/rules');
    } catch (e) {
      return showError('连不上接口：' + (e && e.message ? e.message : e));
    }
    if (!res.ok) {
      return showError(res.status === 404
        ? '接口没起来（HTTP 404）。规则区是宿主侧的接口，要重启一次 DSH 才会生效；页面不用重装。'
        : '接口返回 HTTP ' + res.status);
    }
    rulesData = await res.json();
    R('r-cabinet').style.display = '';
    R('r-edit').disabled = false;
    const aside2 = document.querySelector('.r-list');
    if (aside2) aside2.style.display = '';
    const main2 = document.querySelector('.r-main');
    if (main2) main2.style.gridTemplateColumns = '';
    rulesIdx = Math.min(rulesIdx, rulesData.workspaces.length);
    renderTabs();
    renderCabinet();
    const total = 1 + rulesData.workspaces.length;
    const have = (rulesData.main.exists ? 1 : 0) + rulesData.workspaces.filter((w) => w.exists).length;
    const pct = Math.round((have / total) * 100);
    R('r-bar').style.width = pct + '%';
    R('r-pct').textContent = pct + '%';
    R('r-note').style.color = '';
    R('r-note').textContent = '规则文件 ' + have + ' / ' + total;
    await pickFile(rulesIdx);
  }

  function fileAt(i) { return i === 0 ? rulesData.main : rulesData.workspaces[i - 1]; }
  function fileLabel(f) {
    return f.kind === 'global' ? '全局' : baseName(f.cwd);
  }

  function renderTabs() {
    const box = R('r-tabs');
    box.innerHTML = '';
    const m = document.createElement('button');
    m.className = 'tab pinned' + (rulesIdx === 0 ? ' on' : '');
    m.innerHTML = '<span>主规则</span>';
    m.title = rulesData.main.path;
    m.onclick = () => pickFile(0);
    box.appendChild(m);
    rulesData.workspaces.forEach((w, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (rulesIdx === i + 1 ? ' on' : '') + (w.exists ? '' : ' missing');
      b.innerHTML = '<span>' + baseName(w.cwd) + '</span>';
      b.title = w.cwd;
      b.onclick = () => pickFile(i + 1);
      box.appendChild(b);
    });
  }

  function renderCabinet() {
    const box = R('r-cabinet');
    box.innerHTML = '';
    const all = [rulesData.main, ...rulesData.workspaces];
    all.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'file-card' + (rulesIdx === i ? ' on' : '') + (f.exists ? '' : ' empty');
      const badge = f.kind === 'global'
        ? '<span class="f-badge global">全局</span>'
        : '<span class="f-badge local">仅本区</span>';
      const newTag = f.exists && fresh(f.mtime) ? '<span class="f-new">新</span>' : '';
      card.innerHTML = badge + newTag + '<div class="f-icon"></div><div class="f-body"></div>'
        + '<div class="f-name">' + (f.exists ? 'AGENTS.md' : '未创建') + '</div>'
        + '<div class="f-meta">' + (f.exists ? Math.max(1, Math.round(f.size / 1024)) + 'KB · ' : '') + fileLabel(f)
        + (f.exists ? '' : ' · 点击新建') + '</div>';
      card.title = f.path;
      card.onclick = () => pickFile(i);
      box.appendChild(card);
    });
    // 选中那块上方的标注 + 引线
    const on = box.children[rulesIdx];
    if (on) {
      const f = all[rulesIdx];
      const label = document.createElement('div');
      label.className = 'fab-label';
      label.style.left = (on.offsetLeft + on.offsetWidth / 2) + 'px';
      label.innerHTML = (f.kind === 'global' ? '主规则' : fileLabel(f))
        + (f.exists && fresh(f.mtime) ? '<em>新</em>' : '<i></i>');
      box.appendChild(label);
    }
  }

  async function pickFile(i) {
    rulesIdx = i;
    rulesSec = 0;
    rulesEditing = false;
    renderTabs();
    renderCabinet();
    const f = fileAt(i);
    rulesPath = f.path;
    rulesMtime = f.mtime;
    R('r-edit').classList.remove('on');
    R('r-save').disabled = true;
    R('r-edit-area').classList.add('hidden');
    R('r-view').classList.remove('hidden');
    R('r-title').textContent = f.kind === 'global' ? '全局规则' : baseName(f.cwd) + ' · 规则';
    R('r-list-head').textContent = '小节';

    if (!f.exists) {
      R('r-meta').textContent = f.path + '（还没有这个文件）';
      R('r-list').innerHTML = '';
      R('r-view').innerHTML = '<div class="r-empty teal">' + FOLDER_SVG
        + '<div class="e-title">还没有规则</div>'
        + '<div class="e-note">' + fileLabel(f) + ' 还没有 AGENTS.md。点「编辑」新建，内容只有一行标题：# ' + fileLabel(f) + ' · 规则</div></div>';
      R('r-edit').dataset.create = '1';
      return;
    }
    R('r-edit').dataset.create = '';
    R('r-meta').textContent = f.path + ' · ' + f.size + 'B · ' + new Date(f.mtime).toLocaleString();
    renderSections(f);
    R('r-view').textContent = f.sections[0] ? f.sections[0].text : '';
  }

  function renderSections(f) {
    const box = R('r-list');
    box.innerHTML = '';
    R('r-list-head').textContent = (f.kind === 'global' ? '全局规则' : baseName(f.cwd)) + ' · ' + f.sections.length + ' 节';
    f.sections.forEach((sec, i) => {
      const el = document.createElement('div');
      el.className = 'sec-item' + (i === 0 ? ' on' : '');
      el.innerHTML = '<i>' + String(i + 1).padStart(2, '0') + '</i><span>' + sec.title + '</span>'
        + (fresh(f.mtime) ? '<em>新</em>' : '');
      el.onclick = () => {
        rulesSec = i;
        [...box.children].forEach((c, k) => c.classList.toggle('on', k === i));
        R('r-view').textContent = sec.text;
        R('r-title').textContent = sec.title;
      };
      box.appendChild(el);
    });
  }

  const maybeClose = () => {
    if (rulesEditing && !confirm('还有没保存的改动，确定关掉？')) return;
    rulesEditing = false;
    R('r-save').disabled = true;
    R('r-edit').classList.remove('on');
    R('r-edit-area').classList.add('hidden');
    R('r-view').classList.remove('hidden');
    closeRules();
  };
  R('r-close').onclick = () => maybeClose();
  R('r-back').onclick = () => {
    if (rulesEditing && !confirm('还有没保存的改动，确定离开？')) return;
    rulesEditing = false;
    R('r-save').disabled = true;
    R('r-edit').classList.remove('on');
    R('r-edit-area').classList.add('hidden');
    R('r-view').classList.remove('hidden');
    R('rules').classList.add('hidden');
    canvas.style.filter = '';
    backToGalaxy();
  };
  R('rules').addEventListener('click', (e) => { if (e.target.id === 'rules') maybeClose(); });

  R('r-edit').onclick = async () => {
    if (rulesEditing) return;
    const f = fileAt(rulesIdx);
    const name = f.kind === 'global' ? '全局' : (f.cwd || '').split(/[\\/]/).filter(Boolean).pop();
    let text = '';
    if (f.exists) {
      const res = await fetch('api/rules/file?path=' + encodeURIComponent(f.path));
      if (!res.ok) { R('r-note').textContent = '读取失败：' + res.status; return; }
      const d = await res.json();
      text = d.content; rulesMtime = d.mtime;
    } else {
      text = '# ' + name + ' · 规则\n';
      if (!confirm('这会新建 ' + f.path + '，确定？')) return;
    }
    if (!confirm('这些文件是对我的设定，改完会影响下一轮对话的行为。继续编辑？')) return;
    R('r-edit-area').value = text;
    R('r-edit-area').classList.remove('hidden');
    R('r-view').classList.add('hidden');
    R('r-save').disabled = false;
    R('r-edit').classList.add('on');
    rulesEditing = true;
    R('r-edit-area').focus();
  };

  R('r-save').onclick = async () => {
    if (!rulesEditing) return;
    const f = fileAt(rulesIdx);
    const body = { path: rulesPath, mtime: rulesMtime, content: R('r-edit-area').value, create: !f.exists };
    const res = await fetch('api/rules/file', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    if (res.status === 409) {
      R('r-note').textContent = '文件刚被别处改过，已重新载入，请再改一次';
      rulesEditing = false;
      R('r-save').disabled = true; R('r-edit').classList.remove('on');
      R('r-edit-area').classList.add('hidden'); R('r-view').classList.remove('hidden');
      await loadRules(); pickFile(rulesIdx);
      return;
    }
    if (!res.ok) { R('r-note').textContent = '保存失败：' + res.status; return; }
    const d = await res.json();
    rulesMtime = d.mtime;
    rulesEditing = false;
    R('r-save').disabled = true; R('r-edit').classList.remove('on');
    R('r-edit-area').classList.add('hidden'); R('r-view').classList.remove('hidden');
    R('r-note').textContent = '已保存 · ' + d.size + 'B';
    await loadRules(); pickFile(rulesIdx);
  };

  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (stage === 'panel') { maybeClose(); e.preventDefault(); return; }
    if (stage === 'selected') { stage = 'symbol'; e.preventDefault(); return; }
    if (stage === 'symbol') { backToGalaxy(); e.preventDefault(); }
  });

  // ---------- 交互 ----------
  let dragging = false, lastX = 0, lastY = 0, moved = 0, vYaw = 0, vPitch = 0;

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  const nearSymbol = (x, y) => Math.hypot(x - W / 2, y - H / 2) < 120;

  canvas.addEventListener('pointermove', (e) => {
    if (stage === 'morph' || stage === 'panel') { canvas.style.cursor = 'default'; return; }
    if (stage === 'symbol' || stage === 'selected') {
      symbolHover = nearSymbol(e.clientX, e.clientY);
      canvas.style.cursor = symbolHover ? 'pointer' : 'default';
      return;
    }
    if (!dragging) {
      const n = pick(e.clientX, e.clientY, 18);
      hovered = n && n !== hovered ? n : hovered;
      canvas.style.cursor = n ? 'pointer' : 'default';
      return;
    }
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    // 全范围：yaw 不设限，pitch 也不夹，转到背面、转到反面都行
    vYaw = dx * 0.006;
    vPitch = dy * 0.005;
    target.yaw += vYaw;
    target.pitch += vPitch;
    if (moved > 6) autoSpin = false;
  });
  canvas.addEventListener('pointerleave', () => { hovered = null; symbolHover = false; });
  window.addEventListener('pointerup', (e) => {
    if (stage === 'symbol' || stage === 'selected') {
      if (nearSymbol(e.clientX, e.clientY)) {
        if (stage === 'symbol') stage = 'selected';
        else openRules();
      } else {
        backToGalaxy();          // 点图标以外的黑色区域：放大回星图
      }
      return;
    }
    if (stage !== 'galaxy') return;
    if (!dragging) return;
    dragging = false;
    if (moved < 6) {
      vYaw = 0; vPitch = 0;
      // 中心那一点是「凝缩」的开关，优先于选星
      if (Math.hypot(e.clientX - W / 2, e.clientY - H / 2) < 28) { startMorph(); return; }
      const n = pick(e.clientX, e.clientY, 24);
      if (n) select(n.id);
    } else {
      // 松手时限制一下余速，免得甩飞
      vYaw = Math.max(-0.05, Math.min(0.05, vYaw));
      vPitch = Math.max(-0.05, Math.min(0.05, vPitch));
    }
  });
  window.addEventListener('pointercancel', () => { dragging = false; vYaw = 0; vPitch = 0; });
  canvas.addEventListener('wheel', (e) => {
    if (stage !== 'galaxy') return;
    e.preventDefault();
    const step = (e.ctrlKey ? 0.006 : 0.0016) * (e.deltaMode === 1 ? 16 : 1);
    target.dist = Math.max(1.2, Math.min(14, target.dist + e.deltaY * step));
  }, { passive: false });
  canvas.addEventListener('dblclick', () => {
    if (stage !== 'galaxy') return;
    target.yaw = 0.05; target.pitch = 1.32; target.dist = 5.9;
    autoSpin = true;
  });

  function pick(x, y, radius) {
    let best = null, bestD = radius;
    for (const n of NODES) {
      if (!visible(n)) continue;
      const p = project(nodePos(n));
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  }

  async function select(id) {
    const res = await fetch('api/node?id=' + encodeURIComponent(id));
    if (!res.ok) return;
    const d = await res.json();
    REV = d.rev ?? REV;
    selected = byId.get(id) || d.node;
    const L = layerOf(d.node.level);
    const dt = new Date(d.node.time).toISOString().slice(0, 16).replace('T', ' ');
    const isHidden = !!d.node.hidden;
    document.getElementById('detail-body').innerHTML = `
      <span class="badge" style="color:${L.color}">${L.name}</span>
      <span class="badge" style="color:#5d6884">${d.node.role === 'user' ? '我说的' : '它答的'}</span>
      <h2>${esc(d.node.sessionTitle)}</h2>
      <div class="meta">${dt} · 重要度 ${d.node.imp.toFixed(2)}</div>
      <div class="body">${esc(d.node.text)}</div>
      <div class="acts">
        <button data-act="${isHidden ? 'unhide' : 'hide'}">${isHidden ? '恢复显示' : '不再显示'}</button>
        <button data-act="summary">改概要</button>
      </div>
      <h3>连着的 ${d.related.length} 块</h3>
      ${d.related.map((r) => `<div class="rel" data-id="${esc(r.id)}">${esc(r.text)}…</div>`).join('') || '<div style="color:#5d6884;font-size:12px">没有连线</div>'}
    `;
    document.querySelectorAll('#detail .rel').forEach((el) => {
      el.addEventListener('click', () => select(el.getAttribute('data-id')));
    });
    document.querySelectorAll('#detail .acts button').forEach((el) => {
      el.addEventListener('click', async () => {
        const act = el.getAttribute('data-act');
        if (act === 'summary') {
          const cur = d.node.summary || '';
          const text = window.prompt('这颗星的概要（留空恢复自动生成的）', cur);
          if (text === null) return;
          el.disabled = true;
          await apiOverrides('summary', { id: d.node.id, text });
          return;
        }
        el.disabled = true;
        await apiOverrides(act, { id: d.node.id });
        document.getElementById('detail').classList.remove('on');
        selected = null;
        autoSpin = true;
        focusTarget.x = 0; focusTarget.y = 0; focusTarget.z = 0;
        target.dist = 5.9;
      });
    });
    document.getElementById('detail').classList.add('on');
    autoSpin = false;

    // 局部放大：镜头平移到这颗星，同时拉近
    const node = byId.get(id) || d.node;
    const wp = nodePos(node);
    focusTarget.x = wp.x;
    focusTarget.y = wp.y;
    focusTarget.z = wp.z;
    focusDist = 1.55;          // 记住放大后的距离，关掉时再还原
    target.dist = 1.55;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  document.getElementById('close').addEventListener('click', () => {
    document.getElementById('detail').classList.remove('on');
    selected = null;
    autoSpin = true;
    // 退出局部放大：焦点回到原点，距离复位
    focusTarget.x = 0; focusTarget.y = 0; focusTarget.z = 0;
    target.dist = 5.9;
  });

  // ---------- 搜索 ----------
  const qEl = document.getElementById('q');
  let timer = 0;
  qEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 220); });
  qEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); runSearch(true); }
    if (e.key === 'Escape') { qEl.value = ''; runSearch(); }
  });

  async function runSearch(fly) {
    const q = qEl.value.trim();
    query = q;
    const box = document.getElementById('hits');
    if (!q) { hits = []; box.innerHTML = ''; return; }
    const res = await fetch('api/search?q=' + encodeURIComponent(q));
    const d = await res.json();
    hits = d.hits || [];
    box.innerHTML = hits.slice(0, 12).map((h) => {
      const n = NODES[h.index];
      if (!n) return '';
      const L = layerOf(n.level);
      return `<div class="hit" style="--c:${L.color}" data-id="${esc(n.id)}">
        <b>${esc(shortLabel(n.summary || n.text, 22))}</b><br><span>${esc(n.sessionTitle)} · ${h.score.toFixed(2)}</span></div>`;
    }).join('');
    box.querySelectorAll('.hit').forEach((el) => {
      el.addEventListener('click', () => select(el.getAttribute('data-id')));
    });
    if (fly && hits.length) autoSpin = false;
  }

  // ---------- 图例：按工作区分组 ----------
  function shortPath(p) {
    return p.length > 26 ? p.slice(0, 12) + '…' + p.slice(-11) : p;
  }

  function buildLegend() {
    const counts = new Map();
    for (const n of NODES) counts.set(n.workspace, (counts.get(n.workspace) || 0) + 1);
    WS = [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([id, count], i) => ({ id, count, color: WS_COLORS[i % WS_COLORS.length], label: wsLabel(id) }));

    const box = document.getElementById('legend');
    box.innerHTML = '';
    for (const w of WS) {
      const row = document.createElement('div');
      row.className = 'row';
      row.title = w.label;
      row.innerHTML = `<span class="dot" style="color:${w.color}"></span><span>${esc(shortPath(w.label))}</span><span class="n">${w.count}</span>`;
      row.addEventListener('click', () => {
        if (hiddenWs.has(w.id)) hiddenWs.delete(w.id); else hiddenWs.add(w.id);
        row.classList.toggle('off');
      });
      box.appendChild(row);
    }
  }

  // 调试口子：方便用 CDP 读相机状态或验证缩放/旋转
  window.__MOBIUS__ = {
    cam, target, nodeCount: () => NODES.length,
    // 找一颗重要度最高的星，返回它在屏幕上的位置，方便用 CDP 验证悬停
    spot: () => {
      const n = NODES.slice().sort((a, b) => b.imp - a.imp)[0];
      if (!n) return null;
      const p = project(nodePos(n));
      return { x: Math.round(p.x), y: Math.round(p.y), id: n.id, text: n.text.slice(0, 30) };
    },
    dbg: () => ({ intro, introDone }),
  };

  requestAnimationFrame(frame);
  load().catch(() => { /* 数据没来也照样先看星带 */ });
})();
</script>
</body>
</html>
